name: Release

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      github_ref:
        description: 'Existing GitHub branch or tag to publish'
        required: false
        default: master
        type: string
      npm_tag:
        description: 'NPM dist-tag'
        required: false
        default: latest
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # Keeps dist/action/index.cjs current on every push to master, independent of
  # whether this push is an actual release. A contributor's PR should already
  # include a fresh bundle (enforced by test.yml's "Verify Action bundle is up
  # to date" step), but this is the safety net: it ensures master is never
  # stale by the time release-please's PR is merged, so the release tag always
  # includes a correct bundle.
  rebuild-dist:
    name: Keep dist/action fresh
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Rebuild Action bundle
        run: npm run build:action

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild Action bundle [skip ci]"
          file_pattern: 'dist/action/**'

  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node

  publish-release:
    name: Publish Release to NPM
    runs-on: ubuntu-latest
    needs: release-please
    if: |
      github.event_name == 'push' &&
      needs.release-please.outputs.release_created == 'true'

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: npm ci

      - name: Publish to NPM
        run: NODE_AUTH_TOKEN="" npm publish --provenance --access public --tag latest

      # Moves a floating major-version tag (e.g. v1) to the release commit so
      # GitHub Action consumers can pin `uses: wisefoxme/apex-test-list@v1`
      # instead of an exact patch version.
      - name: Move floating major version tag
        run: |
          MAJOR="v$(node -p "require('./package.json').version.split('.')[0]")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force

  publish-manual:
    name: Publish Manual to NPM
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout specified git ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.github_ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: npm ci

      - name: Publish to NPM
        run: |
          NODE_AUTH_TOKEN="" npm publish \
            --provenance \
            --access public \
            --tag "${{ inputs.npm_tag }}"

  smoke-test:
    name: Smoke Test
    needs: [publish-release, publish-manual]
    if: |
      always() &&
      (needs.publish-release.result == 'success' || needs.publish-manual.result == 'success')
    uses: ./.github/workflows/smoke-test.yml
    secrets: inherit
